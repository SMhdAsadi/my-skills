<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review walkthrough</title>
<script type="application/json" id="walkthrough-data">{}</script>
<script>(function(){var r=document.documentElement;try{var d=JSON.parse(document.getElementById('walkthrough-data').textContent),l=d.lang||'en';r.lang=l;r.dir=/^(fa|ar|he|ur|ps|ku|yi|dv)/i.test(l)?'rtl':'ltr'}catch(e){}try{var t=localStorage.getItem('rw-theme');if(t==='light'||t==='dark')r.dataset.theme=t}catch(e){}})()</script>
<style>
@font-face{font-family:"Vazirmatn";font-weight:400;font-style:normal;font-display:swap;src:local("Vazirmatn"),local("Vazirmatn Regular"),local("Vazir")}
@font-face{font-family:"Vazirmatn";font-weight:600;font-style:normal;font-display:swap;src:local("Vazirmatn SemiBold"),local("Vazirmatn Bold"),local("Vazir Bold")}
html:lang(fa){--font:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
html{--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

:root{--bg:#fafafa;--surface:#fff;--border:#e4e4e7;--text:#383a42;--text-2:#696c77;--text-muted:#6e7177;--accent:#4078f2;--accent-contrast:#fff;--warn:#c18401;--code-bg:#f0f0f1;--add:#50a14f;--del:#e45649;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#282c34;--surface:#2c313c;--border:#3e4451;--text:#dcdfe4;--text-2:#abb2bf;--text-muted:#939cb0;--accent:#61afef;--accent-contrast:#282c34;--warn:#e5c07b;--code-bg:#21252b;--add:#98c379;--del:#e06c75;color-scheme:dark}}
:root[data-theme=dark]{--bg:#282c34;--surface:#2c313c;--border:#3e4451;--text:#dcdfe4;--text-2:#abb2bf;--text-muted:#939cb0;--accent:#61afef;--accent-contrast:#282c34;--warn:#e5c07b;--code-bg:#21252b;--add:#98c379;--del:#e06c75;color-scheme:dark}
@media print{:root:root:root{--bg:#fafafa;--surface:#fff;--border:#e4e4e7;--text:#383a42;--text-2:#696c77;--text-muted:#6e7177;--accent:#4078f2;--accent-contrast:#fff;--warn:#c18401;--code-bg:#f0f0f1;--add:#50a14f;--del:#e45649;color-scheme:light}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--font)}
html:lang(fa) body{font-size:17px;line-height:1.9}
::selection{background:var(--accent);color:var(--accent-contrast)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b,strong,h1,h2,h3,h4{font-weight:600}
.wrap{max-width:780px;margin-inline:auto;padding:24px 16px 48px}
main{min-width:0}
.hdr{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.actions{display:flex;gap:8px;align-items:center}
h1{margin:0;font-size:26px;line-height:1.3;flex:1 1 14rem;min-width:0;overflow-wrap:anywhere}
h2{margin:0 0 12px;font-size:21px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
h3{margin:0 0 10px;font-size:13px;color:var(--text-muted)}
h4{margin:0 0 6px;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
html:lang(fa) h1{font-size:28px;line-height:1.5}
html:lang(fa) h2{font-size:23px;line-height:1.5}
p{margin:0 0 12px;max-width:70ch}
.mut,.lab{color:var(--text-muted);font-size:15px}
.branch,.meta-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 0;color:var(--text-muted);font-size:14px}
.tag{font:.85em var(--mono);background:var(--code-bg);border:1px solid var(--border);border-radius:4px;padding:.1em .45em;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.arr{color:var(--text-muted)}
.add{color:var(--add)}
.del{color:var(--del)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;display:inline-block}
code{font:.9em var(--mono);background:var(--code-bg);padding:.1em .35em;border-radius:4px;unicode-bidi:isolate;overflow-wrap:anywhere}

.seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{font:600 13px var(--font);background:none;border:0;color:var(--text-muted);padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center}
.seg button[aria-pressed=true]{background:var(--code-bg);color:var(--text)}
.ed-sel{font:13px var(--font);background:var(--code-bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;cursor:pointer}

.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px;min-width:0;margin-bottom:20px}
.sec-blk{border-top:1px solid var(--border);margin-top:18px;padding-top:16px}
.co{border-inline-start:3px solid var(--text-muted);padding-inline-start:12px;margin-block:14px}
.co.warn{border-color:var(--warn)}
.co strong{display:block;font-size:13px;color:var(--text-muted)}
.co p{margin:4px 0 0}

.hu-list{display:flex;flex-direction:column;gap:14px}
.hu-item{border-inline-start:3px solid var(--warn);padding-inline-start:14px;padding-block:2px}
.hu-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}

.ref-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 10px}
.ref-pill{display:inline-flex;align-items:center;gap:6px;background:var(--code-bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font:13px/1.4 var(--mono);max-width:100%}
.ref-pill .rl{color:var(--accent);text-decoration:none;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.ref-pill a.rl:hover,.ref-pill a.rl:focus-visible{text-decoration:underline}
.ref-pill svg{vertical-align:-2px}
.cp-btn{background:none;border:0;padding:2px;color:var(--text-muted);cursor:pointer;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;transition:color .1s,background .1s}
.cp-btn:hover{color:var(--text);background:var(--border)}
.cp-btn.done{color:var(--add)}

.std{width:8px;height:8px;border-radius:50%;flex:none}
.std.add{background:var(--add)}
.std.del{background:var(--del)}

ul.chk,ul.pl{list-style:none;margin:0;padding:0}
ul.chk li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--border);align-items:flex-start}
ul.chk li:first-child{border-top:0;padding-top:0}
ul.chk li>div{min-width:0;flex:1}
ul.chk input{width:18px;height:18px;margin-top:.3em;accent-color:var(--accent);flex:none;cursor:pointer}
ul.chk label{cursor:pointer}
.role-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}

ul.pl li{padding-inline-start:16px;position:relative;margin-bottom:8px}
ul.pl li::before{content:"";position:absolute;inset-inline-start:0;top:.85em;width:6px;height:2px;background:var(--text-muted)}

details.skim{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
details.skim summary{cursor:pointer;color:var(--text-muted);font-size:14px;font-weight:600;user-select:none}
details.skim ul{margin:10px 0 0;padding-inline-start:18px}
details.skim li{margin-bottom:4px}
svg{flex:none}
@media print{.seg,.ed-sel,.cp-btn{display:none!important}.card{break-inside:avoid;margin-bottom:16px}}
</style>
</head>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg';
const EDITORS=['vscode','cursor','windsurf','zed','android-studio','goland','idea','copy'];
const VALID_ED=['vscode','vscode-insiders','cursor','windsurf','vscodium','zed','idea','goland','android-studio','studio','webstorm','pycharm','copy'];
const ED_LABELS={vscode:'VS Code',cursor:'Cursor',windsurf:'Windsurf',zed:'Zed','android-studio':'Android Studio',goland:'GoLand',idea:'JetBrains',copy:'Copy Only'};
const I={
en:{branch:'Branch',split:'Split recommendation',overview:'Overview',affects:'Affects',headsUp:'Heads up',check:'Check',filesSec:'Files',skim:'Skim',test:'What to test',crossCutting:'Cross-cutting',text:'Text',theme:'Theme',sys:'System',light:'Light',dark:'Dark',open:'Open in editor',copy:'Copy path',copied:'Copied!',deleted:'Deleted',invalid:'Invalid walkthrough data',files:'files',file:'file',shaHint:'Pinned commit SHA — if HEAD moved, line numbers may be stale'},
fa:{branch:'برنچ',split:'پیشنهاد تفکیک برنچ',overview:'خلاصه تغییرات',affects:'بخش‌های تحت‌تأثیر',headsUp:'نکات حساس و ریسک‌ها',check:'بررسی کنید',filesSec:'فایل‌ها',skim:'بررسی گذرا',test:'مواردی که باید تست شوند',crossCutting:'نکات مشترک بین بخش‌ها',text:'نسخهٔ متنی',theme:'پوسته',sys:'خودکار',light:'روشن',dark:'تیره',open:'باز کردن در ویرایشگر',copy:'کپی مسیر',copied:'کپی شد!',deleted:'حذف‌شده',invalid:'داده‌های راهنما نامعتبر است',files:'فایل',file:'فایل',shaHint:'شناسهٔ کامیت پین‌شده — اگر HEAD جلو رفته باشد، شماره خط‌ها ممکن است قدیمی باشند'}
};

const P={open:'M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5',sys:'M4 5h16v10H4zM9 19h6M12 15v4',sun:'M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',moon:'M20 13A8 8 0 0 1 11 4a8 8 0 1 0 9 9z',copy:'M8 4v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2zM4 8H2v12a2 2 0 0 0 2 2h12v-2H4V8z'};
const h=(t,a,...k)=>{const e=document.createElement(t);for(const x in a||{}){const v=a[x];if(v==null||v===false)continue;if(x==='class')e.className=v;else if(x==='text')e.textContent=v;else if(x.startsWith('on'))e[x]=v;else e.setAttribute(x,v===true?'':v)}for(const c of k.flat(9))if(c!=null&&c!==false)e.append(c);return e};
const icon=(n,cls)=>{const s=document.createElementNS(NS,'svg');for(const[k,v]of Object.entries({viewBox:'0 0 24 24',width:14,height:14,fill:'none',stroke:'currentColor','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true',class:cls||''}))s.setAttribute(k,v);const p=document.createElementNS(NS,'path');p.setAttribute('d',P[n]||P.open);s.append(p);return s};

const root=document.documentElement,app=document.getElementById('app');
let D,L='en',R=false,S=I.en,CB={},curEd='vscode';

const setLang=l=>{L=typeof l==='string'&&l?l:'en';const b=L.split('-')[0].toLowerCase();R=/^(fa|ar|he|ur|ps|ku|yi|dv)$/.test(b);root.lang=L;root.dir=R?'rtl':'ltr';S=Object.assign({},I.en,I[b]||{})};
const f=n=>L.toLowerCase().startsWith('fa')?n.toLocaleString('fa-IR',{useGrouping:false}):String(n);
const LAT=/([A-Za-z0-9_\-]+(?:\.[A-Za-z0-9_\-]+)*)/;

function rich(s){
 const o=[];String(s).split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(p=>{
  if(!p)return;
  if(p[0]==='`'&&p.length>2)o.push(h('code',{dir:'ltr',text:p.slice(1,-1)}));
  else if(p.startsWith('**')&&p.length>4)o.push(h('strong',null,rich(p.slice(2,-2))));
  else if(R){const t=p.replace(/[→➔➜]|->/g,'←');t.split(LAT).forEach((q,j)=>{if(q)o.push(j%2?h('bdi',{text:q}):q)})}
  else o.push(p)
 });return o}

const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
const SAFE=p=>typeof p==='string'&&p.trim()&&!/^(\.\/|\/)/.test(p)&&!/[\\\u0000-\u001f]/.test(p)&&!p.split('/').some(x=>x===''||x==='..'||x==='.');
const LEAD_RE=/^\(\s*[A-Za-z0-9_@.\-/+]+\s*:\s*\d+(?:-\d+)?\s*\)\s*:?/;
const str=(v,w)=>{if(typeof v!=='string'||!v.trim())throw Error(w)};
const prose=(v,w)=>{str(v,w);if(LEAD_RE.test(v.trim()))throw Error(w+'.prose')};
const strArr=(v,w,min)=>{if(!Array.isArray(v)||v.length<(min||0))throw Error(w);v.forEach((x,i)=>str(x,w+'['+i+']'))};
function pref(o,w){
 if(!isObj(o)||!SAFE(o.path))throw Error(w+'.path');
 if(!Number.isInteger(o.startLine)||o.startLine<1)throw Error(w+'.startLine');
 if(o.endLine!=null&&(!Number.isInteger(o.endLine)||o.endLine<o.startLine))throw Error(w+'.endLine');
 if(o.status!=null&&!['modified','added','deleted'].includes(o.status))throw Error(w+'.status')}

function checkHuList(list,w,minRefs){
 if(!Array.isArray(list))throw Error(w);
 list.forEach((hu,j)=>{const ctx=w+'['+j+']';
  if(!isObj(hu))throw Error(ctx);
  str(hu.title,ctx+'.title');prose(hu.body,ctx+'.body');
  if(hu.refs==null){if(minRefs>0)throw Error(ctx+'.refs')}
  else{if(!Array.isArray(hu.refs)||hu.refs.length<minRefs)throw Error(ctx+'.refs');hu.refs.forEach((r,k)=>pref(r,ctx+'.refs['+k+']'))}
  if(hu.extra!=null)strArr(hu.extra,ctx+'.extra',0);
  if(hu.lookFor!=null)str(hu.lookFor,ctx+'.lookFor')})}

function check(d){
 if(!isObj(d)||d.schemaVersion!==3)throw Error('schemaVersion');
 str(d.lang,'lang');
 const m=d.meta;if(!isObj(m))throw Error('meta');
 ['title','branch','base','headSha'].forEach(k=>str(m[k],'meta.'+k));
 if(m.markdownPath!=null)str(m.markdownPath,'meta.markdownPath');
 if(!isObj(m.stats))throw Error('meta.stats');
 ['files','added','removed'].forEach(k=>{if(!Number.isInteger(m.stats[k])||m.stats[k]<0)throw Error('meta.stats.'+k)});
 if(d.repo!=null){if(!isObj(d.repo))throw Error('repo');const ed=d.repo.defaultEditor!=null?d.repo.defaultEditor:d.repo.editor;if(ed!=null&&!VALID_ED.includes(ed))throw Error('repo.defaultEditor')}
 const ov=d.overview;if(!isObj(ov))throw Error('overview');
 str(ov.title,'overview.title');str(ov.affects,'overview.affects');
 if(ov.summary!=null)strArr(ov.summary,'overview.summary',0);
 if(ov.split!=null){if(!isObj(ov.split))throw Error('overview.split');str(ov.split.recommendation,'overview.split.recommendation');if(ov.split.boundaries!=null)strArr(ov.split.boundaries,'overview.split.boundaries',0)}
 if(ov.skim!=null){if(!Array.isArray(ov.skim))throw Error('overview.skim');ov.skim.forEach((p,i)=>{if(!SAFE(p))throw Error('overview.skim['+i+']')})}
 const sl=d.slices;if(!Array.isArray(sl)||!sl.length)throw Error('slices');
 const ids=new Set();
 sl.forEach((s,i)=>{const w='slices['+i+']';
  if(!isObj(s))throw Error(w);
  if(typeof s.id!=='string'||!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(s.id)||ids.has(s.id))throw Error(w+'.id');
  ids.add(s.id);str(s.title,w+'.title');strArr(s.summary,w+'.summary',1);
  if(!Array.isArray(s.files)||!s.files.length)throw Error(w+'.files');
  s.files.forEach((x,j)=>{const fw=w+'.files['+j+']';pref(x,fw);str(x.role,fw+'.role');prose(x.summary,fw+'.summary')});
  if(s.headsUp!=null)checkHuList(s.headsUp,w+'.headsUp',1);
  if(s.qa!=null)strArr(s.qa,w+'.qa',0)});
 if(d.crossCutting!=null){
  const cc=d.crossCutting;if(!isObj(cc))throw Error('crossCutting');
  if(cc.title!=null)str(cc.title,'crossCutting.title');
  if(cc.headsUp!=null)checkHuList(cc.headsUp,'crossCutting.headsUp',0);
  if(cc.qa!=null)strArr(cc.qa,'crossCutting.qa',0);
  if(!((cc.headsUp&&cc.headsUp.length)||(cc.qa&&cc.qa.length)))throw Error('crossCutting.empty')}
}

const loc=r=>r.path+':'+r.startLine+(r.endLine&&r.endLine!==r.startLine?'-'+r.endLine:'');
function shortLoc(r){const range=r.endLine&&r.endLine!==r.startLine?'-'+r.endLine:'';const segs=r.path.split('/');const b=segs[segs.length-1];if((CB[b]||0)>1&&segs.length>1)return '…/'+segs[segs.length-2]+'/'+b+':'+r.startLine+range;return b+':'+r.startLine+range}

function editorUrl(r,ed){
 const o=D.repo||{};if(!o.root||r.status==='deleted'||ed==='copy')return null;
 let b=o.root.replace(/\\/g,'/').replace(/\/+$/,'');if(!b.startsWith('/')&&!/^[A-Za-z]:/.test(b))b='/'+b;
 const enc=s=>s.split('/').map(p=>/^[A-Za-z]:$/.test(p)?p:encodeURIComponent(p)).join('/');
 const full=(b.startsWith('/')?'':'/')+enc(b)+'/'+enc(r.path);
 if(ed==='idea'||ed==='android-studio'||ed==='studio')return'idea://open?file='+encodeURIComponent(b+'/'+r.path)+'&line='+r.startLine;
 if(ed==='goland'||ed==='webstorm'||ed==='pycharm')return ed+'://open?file='+encodeURIComponent(b+'/'+r.path)+'&line='+r.startLine;
 if(ed==='zed')return'zed://file'+full+':'+r.startLine;
 const pre=o.remote?ed+'://vscode-remote/'+o.remote:ed+'://file';
 return pre+full+':'+r.startLine}

function copyToClipboard(text,btn){
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(text).then(ok,err);
 }else{
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');ok()}catch(e){err()}ta.remove();
 }
 function ok(){btn.classList.add('done');btn.title=S.copied||'Copied!';setTimeout(()=>{btn.classList.remove('done');btn.title=S.copy+': '+text},1500)}
 function err(){}}

function refPill(r){
 const t=loc(r),d=shortLoc(r),u=editorUrl(r,curEd);
 const dot=r.status==='added'?h('span',{class:'std add',title:'added'}):r.status==='deleted'?h('span',{class:'std del',title:'deleted'}):null;
 const link=u?h('a',{class:'rl',href:u,title:S.open+': '+t,'aria-label':S.open+': '+t},d,icon('open')):h('span',{class:'rl',title:t},d);
 const cp=h('button',{class:'cp-btn',type:'button',title:S.copy+': '+t,'aria-label':S.copy+': '+t,onclick:e=>{e.stopPropagation();copyToClipboard(t,cp)}},icon('copy'));
 return h('div',{class:'ref-pill','data-path':r.path,'data-start':r.startLine,'data-end':r.endLine||''},dot,link,cp,r.status==='deleted'?h('span',{class:'mut',text:S.deleted}):null)}

const P1=(t,c)=>h('p',{class:c},rich(t));
const co=(l,t,c)=>h('div',{class:'co '+(c||'')},h('strong',{text:l}),P1(t));

function renderHuBlock(list){
 if(!list||!list.length)return null;
 return h('div',{class:'sec-blk'},h('h3',{text:S.headsUp}),h('div',{class:'hu-list'},list.map(hu=>
  h('div',{class:'hu-item'},
   h('div',{class:'hu-head'},h('span',{class:'dot'}),h('h4',null,rich(hu.title))),
   hu.refs&&hu.refs.length?h('div',{class:'ref-row'},hu.refs.map(refPill)):null,
   P1(hu.body),
   hu.extra&&hu.extra.map(p=>P1(p,'mut')),
   hu.lookFor&&co(S.check,hu.lookFor)))))}

const loadSet=k=>{try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:[]}catch(e){return[]}};
function chkBox(k,itemKey,cid,sv){
 const cb=h('input',{type:'checkbox',id:cid});cb.checked=sv.includes(itemKey);
 cb.onchange=()=>{const set=new Set(loadSet(k));cb.checked?set.add(itemKey):set.delete(itemKey);try{localStorage.setItem(k,JSON.stringify([...set]))}catch(e){}};
 return cb}

function renderQaBlock(list,scopeKey){
 if(!list||!list.length)return null;
 const key='rw-qa:'+D.meta.headSha,sv=loadSet(key);
 const ul=h('ul',{class:'chk'},list.map((q,i)=>{
  const cid='qa-'+scopeKey+'-'+i;
  return h('li',null,chkBox(key,scopeKey+':'+i,cid,sv),h('div',null,h('label',{for:cid},rich(q))))}));
 return h('div',{class:'sec-blk'},h('h3',{text:S.test}),ul)}

function renderOverview(ov){
 const unit=L.toLowerCase().startsWith('fa')?S.files:(ov.skim&&ov.skim.length===1?S.file:S.files);
 return h('section',{class:'card ov',id:'overview'},
  h('h2',null,rich(ov.title)),
  ov.summary&&ov.summary.length?ov.summary.map(p=>P1(p)):null,
  h('p',null,h('strong',{text:S.affects+': '}),rich(ov.affects)),
  ov.split?h('div',{class:'sec-blk'},co(S.split,ov.split.recommendation,'warn'),ov.split.boundaries&&ov.split.boundaries.length?h('ul',{class:'pl'},ov.split.boundaries.map(b=>h('li',null,rich(b)))):null):null,
  ov.skim&&ov.skim.length?h('details',{class:'skim'},h('summary',{text:S.skim+' ('+f(ov.skim.length)+' '+unit+')'}),h('ul',null,ov.skim.map(p=>h('li',null,h('code',{dir:'ltr',text:p}))))):null)}

function renderSlice(sl,idx){
 const key='rw-files:'+D.meta.headSha,sv=loadSet(key);
 const fileUl=h('ul',{class:'chk'},sl.files.map((it,i)=>{
  const cid='f-'+sl.id+'-'+i;
  return h('li',null,chkBox(key,sl.id+':'+i,cid,sv),h('div',null,h('div',{class:'role-row'},h('label',{for:cid},h('strong',null,rich(it.role))),refPill(it)),P1(it.summary)))}));
 return h('section',{class:'card slice',id:'slice-'+sl.id},
  h('h2',null,f(idx+1)+'. ',rich(sl.title)),
  sl.summary.map(p=>P1(p)),
  h('div',{class:'sec-blk'},h('h3',{text:S.filesSec}),fileUl),
  renderHuBlock(sl.headsUp),
  renderQaBlock(sl.qa,sl.id))}

function renderCrossCutting(cc){
 if(!cc)return null;
 return h('section',{class:'card cc',id:'cross-cutting'},
  h('h2',null,rich(cc.title||S.crossCutting)),
  renderHuBlock(cc.headsUp),
  renderQaBlock(cc.qa,'cross-cutting'))}

function themeCtl(){let cur=null;try{cur=localStorage.getItem('rw-theme')}catch(e){}
 const g=h('div',{class:'seg',role:'group','aria-label':S.theme});
 [['system',S.sys,'sys'],['light',S.light,'sun'],['dark',S.dark,'moon']].forEach(([v,l,ic])=>{const on=v==='system'?cur!=='light'&&cur!=='dark':cur===v;
  const b=h('button',{type:'button','aria-pressed':String(on),'aria-label':l,title:l},icon(ic));
  b.onclick=()=>{try{v==='system'?localStorage.removeItem('rw-theme'):localStorage.setItem('rw-theme',v)}catch(e){}
   v==='system'?delete root.dataset.theme:root.dataset.theme=v;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};g.append(b)});return g}

function editorCtl(){
 const sel=h('select',{class:'ed-sel','aria-label':'Editor'});
 EDITORS.forEach(ed=>{const opt=h('option',{value:ed,text:ED_LABELS[ed]});if(ed===curEd)opt.selected=true;sel.append(opt)});
 sel.onchange=()=>{curEd=sel.value;try{localStorage.setItem('rw-editor',curEd)}catch(e){}updateAllLinks()};
 return sel}

function updateAllLinks(){
 document.querySelectorAll('.ref-pill').forEach(pill=>{
  const path=pill.getAttribute('data-path'),start=+pill.getAttribute('data-start'),end=pill.getAttribute('data-end')?+pill.getAttribute('data-end'):undefined;
  const r={path:path,startLine:start,endLine:end};
  const u=editorUrl(r,curEd);const oldA=pill.querySelector('a.rl'),oldSpan=pill.querySelector('span.rl');
  const d=shortLoc(r),t=loc(r);
  if(u){
   const newA=h('a',{class:'rl',href:u,title:S.open+': '+t,'aria-label':S.open+': '+t},d,icon('open'));
   if(oldA)oldA.replaceWith(newA);else if(oldSpan)oldSpan.replaceWith(newA);
  }else{
   const newSpan=h('span',{class:'rl',title:t},d);
   if(oldA)oldA.replaceWith(newSpan);else if(oldSpan)oldSpan.replaceWith(newSpan);
  }
 })}

const mount=(el,...ch)=>{if(el.replaceChildren)el.replaceChildren(...ch);else{while(el.firstChild)el.removeChild(el.firstChild);ch.flat(9).forEach(c=>{if(c!=null&&c!==false)el.append(typeof c==='string'?document.createTextNode(c):c)})}};

function fail(msg){setLang(D&&D.lang);mount(app,h('main',null,h('section',{class:'card'},h('h2',{text:S.invalid}),h('p',null,h('code',{dir:'ltr',text:String(msg)})))))}

function build(){
 const m=D.meta;document.title=R?m.title.replace(/[→➔➜]|->/g,'←'):m.title;
 const uniq=new Set();
 D.slices.forEach(sl=>{sl.files.forEach(x=>uniq.add(x.path));(sl.headsUp||[]).forEach(hu=>(hu.refs||[]).forEach(r=>uniq.add(r.path)))});
 if(D.crossCutting)(D.crossCutting.headsUp||[]).forEach(hu=>(hu.refs||[]).forEach(r=>uniq.add(r.path)));
 CB={};uniq.forEach(p=>{const b=p.split('/').pop();CB[b]=(CB[b]||0)+1});
 try{const savedEd=localStorage.getItem('rw-editor');if(savedEd&&EDITORS.includes(savedEd))curEd=savedEd;else if(savedEd==='studio')curEd='android-studio';else if(D.repo&&(D.repo.defaultEditor||D.repo.editor)){const dEd=D.repo.defaultEditor||D.repo.editor;curEd=dEd==='studio'?'android-studio':(EDITORS.includes(dEd)?dEd:curEd)}}catch(e){}
 const mdBase=String(m.markdownPath||'').split('/').pop();
 const unit=L.toLowerCase().startsWith('fa')?S.files:(m.stats.files===1?S.file:S.files);
 const top=h('header',{class:'hdr'},
  h('div',{class:'row'},h('h1',null,rich(m.title)),h('div',{class:'actions'},editorCtl(),themeCtl())),
  h('div',{class:'branch'},h('span',{text:S.branch+': '}),h('code',{class:'tag',dir:'ltr',text:m.branch}),h('span',{class:'arr',text:R?'←':'→'}),h('code',{class:'tag',dir:'ltr',text:m.base})),
  h('div',{class:'meta-line'},
   h('span',null,f(m.stats.files)+' '+unit+' · ',h('bdi',{dir:'ltr',class:'add',text:'+'+m.stats.added}),' / ',h('bdi',{dir:'ltr',class:'del',text:'−'+m.stats.removed})),
   h('span',{text:'·'}),h('code',{dir:'ltr',title:S.shaHint,text:m.headSha}),
   mdBase?h('span',{text:'·'}):null,mdBase?h('code',{dir:'ltr',title:m.markdownPath,text:mdBase}):null));
 const mainEl=h('main',null,
  renderOverview(D.overview),
  D.slices.map((sl,i)=>renderSlice(sl,i)),
  renderCrossCutting(D.crossCutting));
 mount(app,top,mainEl)}
try{D=JSON.parse(document.getElementById('walkthrough-data').textContent);setLang(D.lang);check(D);build()}catch(e){fail(e.message)}
})();
</script>
</body>
