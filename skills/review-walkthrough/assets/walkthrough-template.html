:root{--bg:#fafafa;--surface:#fff;--border:#e4e4e7;--text:#383a42;--text-2:#696c77;--text-muted:#6e7177;--accent:#4078f2;--accent-contrast:#fff;--warn:#c18401;--code-bg:#f0f0f1;--add:#50a14f;--del:#e45649;--dx:1;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#282c34;--surface:#2c313c;--border:#3e4451;--text:#dcdfe4;--text-2:#abb2bf;--text-muted:#939cb0;--accent:#61afef;--accent-contrast:#282c34;--warn:#e5c07b;--code-bg:#21252b;--add:#98c379;--del:#e06c75;color-scheme:dark}}
:root[data-theme=dark]{--bg:#282c34;--surface:#2c313c;--border:#3e4451;--text:#dcdfe4;--text-2:#abb2bf;--text-muted:#939cb0;--accent:#61afef;--accent-contrast:#282c34;--warn:#e5c07b;--code-bg:#21252b;--add:#98c379;--del:#e06c75;color-scheme:dark}
@media print{:root:root:root{--bg:#fafafa;--surface:#fff;--border:#e4e4e7;--text:#383a42;--text-2:#696c77;--text-muted:#6e7177;--accent:#4078f2;--accent-contrast:#fff;--warn:#c18401;--code-bg:#f0f0f1;--add:#50a14f;--del:#e45649;color-scheme:light}}
:root[dir=rtl]{--dx:-1}
html:lang(fa),html:lang(ar){--font:"Vazirmatn",Tahoma,system-ui,sans-serif}
html{--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--font)}
html:lang(fa) body,html:lang(ar) body{font-size:17px;line-height:1.9}
::selection{background:var(--accent);color:var(--accent-contrast)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b,strong,h1,h2,h3{font-weight:600}
.wrap{max-width:760px;margin-inline:auto;padding:24px 16px 0;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
.row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
h1{margin:0;font-size:28px;line-height:1.3;flex:1 1 16rem;min-width:0;overflow-wrap:anywhere}
h2{margin:8px 0 12px;font-size:22px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
h3{margin:0 0 8px;font-size:13px;color:var(--text-muted)}
html:lang(fa) h1,html:lang(ar) h1{font-size:30px;line-height:1.5}
html:lang(fa) h2,html:lang(ar) h2{font-size:24px;line-height:1.5}
p{margin:0 0 12px;max-width:70ch}
.mut,.status,.lab{color:var(--text-muted);font-size:15px}
.branch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px;color:var(--text-muted);font-size:15px}
.tag{font:.85em var(--mono);background:var(--code-bg);border:1px solid var(--border);border-radius:4px;padding:.1em .45em;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.arr{color:var(--text-muted)}
.stats{margin:0 0 16px;color:var(--text-muted);font-size:15px}
.add{color:var(--add)}
.del{color:var(--del)}
.lab{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-weight:600;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
code{font:.9em var(--mono);background:var(--code-bg);padding:.1em .35em;border-radius:4px;unicode-bidi:isolate;overflow-wrap:anywhere}
.seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{font:600 13px var(--font);background:none;border:0;color:var(--text-muted);padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center}
.seg button[aria-pressed=true]{background:var(--code-bg);color:var(--text)}
.prog{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.prog li{flex:1}
.prog button{display:block;width:100%;height:24px;background:none;border:0;padding:0;cursor:pointer;position:relative}
.prog button::after{content:"";position:absolute;inset-inline:0;top:10px;height:4px;border-radius:2px;background:var(--border)}
.prog button.on::after{background:var(--accent)}
.status{margin:6px 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px;min-height:180px;min-width:0}
.card.in{animation:sl .14s ease-out}
@keyframes sl{from{opacity:0;transform:translateX(calc(var(--dx)*12px))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.blk{border-top:1px solid var(--border);margin-top:20px;padding-top:16px}
.co{border-inline-start:3px solid var(--text-muted);padding-inline-start:12px;margin-block:16px}
.co.warn{border-color:var(--warn)}
.co strong{display:block;font-size:13px;color:var(--text-muted)}
.co p{margin:4px 0 0}
.ref{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.rl{display:block;width:fit-content;max-width:100%;direction:ltr;unicode-bidi:isolate;font:14px var(--mono);overflow-wrap:anywhere}
a.rl{color:var(--accent);text-decoration:none}
a.rl:hover,a.rl:focus-visible{text-decoration:underline}
a.rl svg{vertical-align:-2px;margin-inline-start:4px}
.std{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.std.add{background:var(--add)}
.std.del{background:var(--del)}
a.rl-in{color:var(--accent);text-decoration:none;direction:ltr;unicode-bidi:isolate;font:.9em var(--mono);overflow-wrap:anywhere}
a.rl-in:hover,a.rl-in:focus-visible{text-decoration:underline}
ul.chk,ul.pl{list-style:none;margin:0;padding:0}
ul.chk li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
ul.chk li:first-child{border-top:0}
ul.chk li>div{min-width:0;flex:1}
main{min-width:0}
ul.chk input{width:18px;height:18px;margin-top:.45em;accent-color:var(--accent);flex:none}
ul.chk label{cursor:pointer}
ul.pl li{padding-inline-start:16px;position:relative;margin-bottom:8px}
ul.pl li::before{content:"";position:absolute;inset-inline-start:0;top:.85em;width:6px;height:2px;background:var(--text-muted)}
.nav{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);margin-top:16px;padding:12px 0;display:flex;gap:12px}
.btn{flex:1;min-height:44px;padding-inline:16px;border-radius:6px;font:600 15px var(--font);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:1px solid var(--border);background:none;color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.btn:disabled{opacity:.45;cursor:default}
.foot{padding:12px 0 20px;font-size:13px}
.foot p{margin:0 0 4px;max-width:none}
svg{flex:none}
[dir=rtl] .dir-icon{transform:scaleX(-1)}
@media print{.nav,.seg,.prog,.status{display:none}.card[hidden]{display:block!important}.card{break-inside:avoid;margin-bottom:16px;min-height:0}}
</style>

const icon=(n,cls)=>{const s=document.createElementNS(NS,'svg');for(const[k,v]of Object.entries({viewBox:'0 0 24 24',width:n==='open'?14:18,height:n==='open'?14:18,fill:'none',stroke:'currentColor','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true',class:cls||''}))s.setAttribute(k,v);const p=document.createElementNS(NS,'path');p.setAttribute('d',P[n]);s.append(p);return s};
const root=document.documentElement,app=document.getElementById('app');
let D,L='en',R=false,S=I.en,CB={};
const setLang=l=>{L=typeof l==='string'&&l?l:'en';const b=L.split('-')[0].toLowerCase();R=/^(fa|ar|he|ur|ps|ku|yi|dv)$/.test(b);root.lang=L;root.dir=R?'rtl':'ltr';S=Object.assign({},I.en,I[b]||{},(D&&D.ui)||{});S.cat=Object.assign({},I.en.cat,(I[b]||{}).cat,((D&&D.ui)||{}).cat)};
const f=n=>L.toLowerCase().startsWith('fa')?n.toLocaleString('fa-IR',{useGrouping:false}):String(n);
const LAT=/([A-Za-z][A-Za-z0-9_\-]*(?:[./][A-Za-z0-9_\-]+)*)/;
const RERE=/([A-Za-z0-9_@][A-Za-z0-9_@\-/+.]*\.[A-Za-z0-9]+:\d+(?:-\d+)?)/;
function linkify(t){const o=[];String(t).split(RERE).forEach((p,i)=>{if(!p)return;if(i%2){const m=p.match(/^(.+):(\d+)(?:-(\d+))?$/);const r={path:m[1],startLine:+m[2]};if(m[3]&&+m[3]!==+m[2])r.endLine=+m[3];const u=url(r);o.push(u?h('a',{class:'rl-in',href:u,title:S.open+': '+p,'aria-label':S.open+': '+p},shortLoc(r)):h('code',{dir:'ltr',text:shortLoc(r)}))}else if(R)p.split(LAT).forEach((q,j)=>{if(q)o.push(j%2?h('bdi',{text:q}):q)});else o.push(p)});return o}

const SAFE=p=>typeof p==='string'&&p&&!/^(\.\/|\/)/.test(p)&&!/[\\\u0000-\u001f]/.test(p)&&!p.split('/').some(x=>x===''||x==='..');
function pref(o,w){if(!o||!SAFE(o.path))throw Error(w+'.path');if(!Number.isInteger(o.startLine)||o.startLine<1)throw Error(w+'.startLine');if(o.endLine!=null&&(!Number.isInteger(o.endLine)||o.endLine<o.startLine))throw Error(w+'.endLine');if(o.status!=null&&!['modified','added','deleted'].includes(o.status))throw Error(w+'.status')}

const arr=(v,w,a,b)=>{if(!Array.isArray(v)||v.length<a||v.length>b)throw Error(w);v.forEach((x,i)=>str(x,w+'['+i+']'))};
function check(d){
 if(!d||d.schemaVersion!==1)throw Error('schemaVersion');
 const m=d.meta||{};['title','branch','base','headSha'].forEach(k=>str(m[k],'meta.'+k));
 ['files','added','removed'].forEach(k=>{if(!Number.isInteger((m.stats||{})[k]))throw Error('meta.stats.'+k)});
 const r=d.repo||{};if(r.editor&&!SCH[r.editor])throw Error('repo.editor');
 const st=d.steps;if(!Array.isArray(st)||st.length<3)throw Error('steps');
 const ids=new Set(),n={};
 st.forEach((x,i)=>{const w='steps['+i+']';
  if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(x.id||'')||ids.has(x.id))throw Error(w+'.id');ids.add(x.id);
  if(!['scope','split','gotcha','reading','test'].includes(x.kind))throw Error(w+'.kind');n[x.kind]=(n[x.kind]||0)+1;
  str(x.section,w+'.section');str(x.title,w+'.title',160);
  if(x.kind==='scope'){if(i)throw Error(w+' scope must be first');arr(x.gist,w+'.gist',1,3);str(x.affects,w+'.affects')}
  if(x.kind==='split'){if(i!==1)throw Error(w+' split must follow scope');str(x.recommendation,w+'.recommendation');if(x.boundaries)arr(x.boundaries,w+'.boundaries',1,8)}
  if(x.kind==='gotcha'){if(!['edge-case','state','layout','concurrency','persistence','other'].includes(x.category))throw Error(w+'.category');str(x.body,w+'.body');if(!Array.isArray(x.refs)||x.refs.length<1||x.refs.length>3)throw Error(w+'.refs');x.refs.forEach((q,j)=>pref(q,w+'.refs['+j+']'));if(x.extra)arr(x.extra,w+'.extra',1,1);if(x.lookFor)str(x.lookFor,w+'.lookFor')}
  if(x.kind==='reading'){if(!Array.isArray(x.items)||!x.items.length)throw Error(w+'.items');x.items.forEach((q,j)=>{pref(q,w+'.items['+j+']');str(q.role,w+'.items['+j+'].role');str(q.summary,w+'.items['+j+'].summary')});if(x.skim)x.skim.forEach((p,j)=>{if(!SAFE(p))throw Error(w+'.skim['+j+']')})}

 if(n.scope!==1||n.reading!==1||n.test!==1||(n.split||0)>1||!n.gotcha||n.gotcha>4)throw Error('step counts');

}
const loc=r=>r.path+':'+r.startLine+(r.endLine&&r.endLine!==r.startLine?'-'+r.endLine:'');
function url(r){const o=D.repo||{};if(!o.root||r.status==='deleted')return null;
 let b=o.root.replace(/\\/g,'/').replace(/\/+$/,'');if(!b.startsWith('/')&&!/^[A-Za-z]:/.test(b))b='/'+b;
 const enc=s=>s.split('/').map(p=>/^[A-Za-z]:$/.test(p)?p:encodeURIComponent(p)).join('/');
 const e=o.editor||'vscode',pre=o.remote?e+'://vscode-remote/'+o.remote:e+'://file';

function shortLoc(r){const range=r.endLine&&r.endLine!==r.startLine?'-'+r.endLine:'';const segs=r.path.split('/');const b=segs[segs.length-1];if((CB[b]||0)>1&&segs.length>1)return '…/'+segs[segs.length-2]+'/'+b+':'+r.startLine+range;return b+':'+r.startLine+range}

 const a=u?h('a',{class:'rl',href:u,title:S.open+': '+t,'aria-label':S.open+': '+t},d,icon('open')):h('span',{class:'rl',title:t},d);

const P1=(t,c)=>h('p',{class:c},rich(t));
const co=(l,t,c)=>h('div',{class:'co '+(c||'')},h('strong',{text:l}),P1(t));
const T=x=>h('h2',null,rich(x.title));
const B={
scope:x=>[x.scopeLabel&&h('p',{class:'lab',text:x.scopeLabel}),T(x),h('section',{class:'blk'},h('h3',{text:S.gist}),x.gist.map(p=>P1(p))),h('p',null,h('strong',{text:S.affects+': '}),rich(x.affects))],
split:x=>[T(x),co(S.split,x.recommendation,'warn'),x.boundaries&&h('ul',{class:'pl'},x.boundaries.map(b=>h('li',null,rich(b))))],
gotcha:(x,n,t)=>[h('p',{class:'lab'},h('span',{class:'dot'}),S.heads+' '+f(n)+' '+S.of+' '+f(t)+' · '+(S.cat[x.category]||x.category)),T(x),P1(x.body),x.refs.map(ref),(x.extra||[]).map(p=>P1(p,'mut')),x.lookFor&&co(S.check,x.lookFor)],

  const b=h('button',{type:'button','aria-pressed':String(on),'aria-label':l,title:l},icon(ic));
  b.onclick=()=>{try{v==='system'?localStorage.removeItem('rw-theme'):localStorage.setItem('rw-theme',v)}catch(e){}

 const m=D.meta,st=D.steps,tot=st.length,gt=st.filter(x=>x.kind==='gotcha').length;let gn=0;document.title=m.title;CB={};st.forEach(x=>{(x.refs||[]).concat(x.items||[]).forEach(r=>{if(r&&r.path){const b=r.path.split('/').pop();CB[b]=(CB[b]||0)+1}})});

  h('div',{class:'branch'},h('span',{text:S.branch+': '}),h('code',{class:'tag',dir:'ltr',text:m.branch}),h('span',{class:'arr',text:'→'}),h('code',{class:'tag',dir:'ltr',text:m.base})),
  h('p',{class:'stats'},f(m.stats.files)+' '+S.files+' · ',h('bdi',{dir:'ltr',class:'add',text:'+'+m.stats.added}),' / ',h('bdi',{dir:'ltr',class:'del',text:'−'+m.stats.removed})),prog,status);

 const [fa,fb]=S.foot.split('{sha}');

 const ft=h('footer',{class:'foot mut'},h('p',null,fa,h('code',{dir:'ltr',text:m.headSha}),fb),m.markdownPath?h('p',null,S.text+': ',h('code',{dir:'ltr',title:m.markdownPath,text:mdBase})):null);
 app.replaceChildren(top,h('main',null,cards),h('div',{class:'nav'},pv,nx),ft);
 let cur=-1;
 const show=i=>{i=Math.max(0,Math.min(tot-1,i));const ch=i!==cur;cur=i;
  cards.forEach((c,j)=>{c.hidden=j!==i});prog.querySelectorAll('button').forEach((b,j)=>{b.classList.toggle('on',j<=i);j===i?b.setAttribute('aria-current','step'):b.removeAttribute('aria-current')});
  status.textContent=S.step+' '+f(i+1)+' '+S.of+' '+f(tot)+' · '+st[i].section;pv.disabled=i===0;nx.disabled=i===tot-1;
  if(ch){const c=cards[i];c.classList.remove('in');void c.offsetWidth;c.classList.add('in');try{history.replaceState(null,'','#'+st[i].id)}catch(e){}window.scrollTo(0,0)}};
 prog.querySelectorAll('button').forEach((b,j)=>b.onclick=()=>show(j));
 pv.onclick=()=>show(cur-1);nx.onclick=()=>show(cur+1);
 addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;const t=e.target;if(t&&/^(TEXTAREA|SELECT)$/.test(t.tagName))return;
  const k=e.key;if(k==='ArrowRight')show(cur+(R?-1:1));else if(k==='ArrowLeft')show(cur+(R?1:-1));else if(k==='Home')show(0);else if(k==='End')show(tot-1);else return;e.preventDefault()});
