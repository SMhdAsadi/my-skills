<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review walkthrough</title>
<script type="application/json" id="walkthrough-data">{}</script>
<script>(function(){var r=document.documentElement;try{var d=JSON.parse(document.getElementById('walkthrough-data').textContent),l=d.lang||'en';r.lang=l;r.dir=/^(fa|ar|he|ur|ps|ku|yi|dv)/i.test(l)?'rtl':'ltr'}catch(e){}try{var t=localStorage.getItem('rw-theme');if(t==='light'||t==='dark')r.dataset.theme=t}catch(e){}})()</script>
<style>
@font-face{font-family:"Vazirmatn";font-weight:400;font-style:normal;font-display:swap;src:local("Vazirmatn"),local("Vazirmatn Regular"),local("Vazir")}
@font-face{font-family:"Vazirmatn";font-weight:600;font-style:normal;font-display:swap;src:local("Vazirmatn SemiBold"),local("Vazirmatn Bold"),local("Vazir Bold")}
html:lang(fa){--font:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
html{--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

:root{--bg:#fafafa;--surface:#fff;--border:#e4e4e7;--text:#383a42;--text-2:#696c77;--text-muted:#6e7177;--accent:#4078f2;--accent-contrast:#fff;--warn:#c18401;--code-bg:#f0f0f1;--add:#50a14f;--del:#e45649;--dx:1;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#282c34;--surface:#2c313c;--border:#3e4451;--text:#dcdfe4;--text-2:#abb2bf;--text-muted:#939cb0;--accent:#61afef;--accent-contrast:#282c34;--warn:#e5c07b;--code-bg:#21252b;--add:#98c379;--del:#e06c75;color-scheme:dark}}
:root[data-theme=dark]{--bg:#282c34;--surface:#2c313c;--border:#3e4451;--text:#dcdfe4;--text-2:#abb2bf;--text-muted:#939cb0;--accent:#61afef;--accent-contrast:#282c34;--warn:#e5c07b;--code-bg:#21252b;--add:#98c379;--del:#e06c75;color-scheme:dark}
@media print{:root:root:root{--bg:#fafafa;--surface:#fff;--border:#e4e4e7;--text:#383a42;--text-2:#696c77;--text-muted:#6e7177;--accent:#4078f2;--accent-contrast:#fff;--warn:#c18401;--code-bg:#f0f0f1;--add:#50a14f;--del:#e45649;color-scheme:light}}
:root[dir=rtl]{--dx:-1}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--font)}
html:lang(fa) body{font-size:17px;line-height:1.9}
::selection{background:var(--accent);color:var(--accent-contrast)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b,strong,h1,h2,h3{font-weight:600}
.wrap{max-width:760px;margin-inline:auto;padding:24px 16px 0;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;min-width:0}
.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.actions{display:flex;gap:8px;align-items:center}
h1{margin:0;font-size:26px;line-height:1.3;flex:1 1 14rem;min-width:0;overflow-wrap:anywhere}
h2{margin:8px 0 12px;font-size:22px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
h3{margin:0 0 8px;font-size:13px;color:var(--text-muted)}
html:lang(fa) h1{font-size:28px;line-height:1.5}
html:lang(fa) h2{font-size:24px;line-height:1.5}
p{margin:0 0 12px;max-width:70ch}
.mut,.status,.lab{color:var(--text-muted);font-size:15px}
.branch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px;color:var(--text-muted);font-size:15px}
.tag{font:.85em var(--mono);background:var(--code-bg);border:1px solid var(--border);border-radius:4px;padding:.1em .45em;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.arr{color:var(--text-muted)}
.stats{margin:0 0 16px;color:var(--text-muted);font-size:15px}
.add{color:var(--add)}
.del{color:var(--del)}
.lab{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-weight:600;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
code{font:.9em var(--mono);background:var(--code-bg);padding:.1em .35em;border-radius:4px;unicode-bidi:isolate;overflow-wrap:anywhere}

.seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{font:600 13px var(--font);background:none;border:0;color:var(--text-muted);padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center}
.seg button[aria-pressed=true]{background:var(--code-bg);color:var(--text)}

.ed-sel{font:13px var(--font);background:var(--code-bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;cursor:pointer}

.prog{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.prog li{flex:1}
.prog button{display:block;width:100%;height:24px;background:none;border:0;padding:0;cursor:pointer;position:relative}
.prog button::after{content:"";position:absolute;inset-inline:0;top:10px;height:4px;border-radius:2px;background:var(--border)}
.prog button.on::after{background:var(--accent)}
.status{margin:6px 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px;min-height:180px;min-width:0}
.card[hidden]{display:none!important}
.card:not([hidden]){display:block}
.card.in{animation:sl .14s ease-out}
@keyframes sl{from{opacity:0;transform:translateX(calc(var(--dx)*12px))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.blk{border-top:1px solid var(--border);margin-top:20px;padding-top:16px}
.co{border-inline-start:3px solid var(--text-muted);padding-inline-start:12px;margin-block:16px}
.co.warn{border-color:var(--warn)}
.co strong{display:block;font-size:13px;color:var(--text-muted)}
.co p{margin:4px 0 0}

.ref-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 14px}
.ref-pill{display:inline-flex;align-items:center;gap:6px;background:var(--code-bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font:13px/1.4 var(--mono);max-width:100%}
.ref-pill .rl{color:var(--accent);text-decoration:none;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.ref-pill a.rl:hover,.ref-pill a.rl:focus-visible{text-decoration:underline}
.ref-pill svg{vertical-align:-2px}
.cp-btn{background:none;border:0;padding:2px;color:var(--text-muted);cursor:pointer;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;transition:color .1s,background .1s}
.cp-btn:hover{color:var(--text);background:var(--border)}
.cp-btn.done{color:var(--add)}

.std{width:8px;height:8px;border-radius:50%;flex:none}
.std.add{background:var(--add)}
.std.del{background:var(--del)}

ul.chk,ul.pl{list-style:none;margin:0;padding:0}
ul.chk li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border);align-items:flex-start}
ul.chk li:first-child{border-top:0}
ul.chk li>div{min-width:0;flex:1}
ul.chk input{width:18px;height:18px;margin-top:.35em;accent-color:var(--accent);flex:none;cursor:pointer}
ul.chk label{cursor:pointer}
.chk-list{max-height:420px;overflow-y:auto;padding-inline-end:4px}
.role-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}

ul.pl li{padding-inline-start:16px;position:relative;margin-bottom:8px}
ul.pl li::before{content:"";position:absolute;inset-inline-start:0;top:.85em;width:6px;height:2px;background:var(--text-muted)}
.nav{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);margin-top:16px;padding:12px 0;display:flex;gap:12px}
.btn{flex:1;min-height:44px;padding-inline:16px;border-radius:6px;font:600 15px var(--font);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:1px solid var(--border);background:none;color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.btn:disabled{opacity:.45;cursor:default}
.foot{padding:12px 0 20px;font-size:13px}
.foot p{margin:0 0 4px;max-width:none}
svg{flex:none}
[dir=rtl] .dir-icon{transform:scaleX(-1)}
@media print{.nav,.seg,.prog,.status,.ed-sel,.cp-btn{display:none!important}.card[hidden]{display:block!important}.card{break-inside:avoid;margin-bottom:16px;min-height:0}.chk-list{max-height:none!important;overflow:visible!important}}
</style>
</head>

function build(){
 const m=D.meta,st=D.steps,tot=st.length,gt=st.filter(x=>x.kind==='gotcha').length;let gn=0;document.title=R?m.title.replace(/[→➔➜]|->/g,'←'):m.title;
